
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>404 — Page Not Found</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      color: #111111;
      font-family: Inter, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }

    header {
      width: 100%;
      padding: 28px 7%;
      display: flex;
      justify-content: flex-end;
    }

    .status {
      font-size: 13px;
      color: #777777;
      letter-spacing: 1px;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px 80px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    .error-code {
      font-size: clamp(120px, 25vw, 240px);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -12px;
      color: #111111;
    }

    .error-code span {
      color: #7657ff;
    }

    h1 {
      margin-top: 35px;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 650;
      letter-spacing: -1px;
    }

    .description {
      margin: 16px auto 30px;
      max-width: 430px;
      font-size: 16px;
      line-height: 1.8;
      color: #777777;
    }

    .home-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 15px 25px;
      border-radius: 9px;
      background: #111111;
      color: #ffffff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.2s, transform 0.2s;
    }

    .home-button:hover {
      background: #000000;
      transform: translateY(-2px);
    }

    .home-button:focus-visible {
      outline: 3px solid #000000;
      outline-offset: 4px;
    }

    footer {
      text-align: center;
      padding: 24px 15px;
      color: #999999;
      font-size: 12px;
      letter-spacing: 1px;
    }

    @media (max-width: 480px) {
      header {
        padding: 22px;
      }

      .error-code {
        letter-spacing: -6px;
      }

      h1 {
        margin-top: 28px;
      }

      .description {
        font-size: 14px;
      }
    }
  </style>
</head>
<!-- If you open this code, you'll find what I never had the courage to say. -->
<body>
  <header>
    <div class="status">why tou still entering this page?</div>
  </header>

  <main>
    <section class="container">
      <div class="error-code">4<span>0</span>4</div>

      <h1>Page not found.</h1>

      <p class="description">
        Sorry, we couldn't find the page you're looking for.
        It may have been moved, deleted, or never existed.
      </p>

      <a class="home-button" href="/">
        <span aria-hidden="true">←</span>
        Back to home
      </a>
    </section>
  </main>
 <p style="font-size: 9px; color: #999;">can we back?
 </p>
  
  <footer>
    © 2026 · All rights reserved.
  </footer>
</body>
</html>
